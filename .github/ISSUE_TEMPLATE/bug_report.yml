name: Bug report
description: Report reproducible software behavior (not a compliance determination).
body:
  - type: markdown
    attributes:
      value: "MachLane is a research prototype and is not FAA approved."
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include configuration, versions, checksums and minimal inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

